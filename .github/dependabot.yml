# Weekly dependency update PRs. Each one runs the full CI (unit tests, lint, release
# build, emulator tour), which is what makes merging them a low-risk click.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Versions that must move together, so they arrive as one PR.
      kotlin-toolchain:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
      androidx:
        patterns:
          - "androidx.*"
      testing:
        patterns:
          - "junit*"
          - "io.mockk*"
          - "app.cash.turbine*"
          - "org.robolectric*"
          - "org.json*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
