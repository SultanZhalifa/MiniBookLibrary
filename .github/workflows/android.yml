name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

# Cancel an older run on the same branch when a newer push lands so we don't
# burn minutes on stale revisions.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # Cache build outputs across runs to keep wall-clock time predictable.
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Lint errors fail the build. Both layout crashes found by the emulator tour (a view
      # with no size, an anchor to a missing id) are lint errors, so this is the cheap net.
      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Unsigned, but runs R8 with the real shrinker rules so a missing keep rule fails here.
      - name: Assemble release (R8 check)
        run: ./gradlew assembleRelease --stacktrace

      # KSP regenerates app/schemas on every build. If that left a diff, an entity changed
      # without its snapshot being committed, and the migration test can't cover it.
      - name: Check Room schemas are committed
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::error::Room schema changed. Commit the new JSON from the room-schemas artifact."
            git status --porcelain app/schemas
            exit 1
          fi

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn

      - name: Upload test and lint reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

  emulator-screenshots:
    name: Emulator screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Hardware acceleration for the x86_64 emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 35 is the first level that enforces edge-to-edge, which is what these
      # screenshots exist to check. Each script line runs on its own, so the test exit
      # code is kept and re-raised after the pull.
      - name: Run screenshot tour
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # hide_error_dialogs: CI emulators sometimes pop "Pixel Launcher isn't responding"
          # over the app, which blocks Espresso's clicks.
          script: |
            adb shell settings put global hide_error_dialogs 1
            ./gradlew connectedDebugAndroidTest --stacktrace; status=$?; adb pull /data/local/tmp/screenshots screenshots-out || true; exit $status

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots-out/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload instrumented test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
